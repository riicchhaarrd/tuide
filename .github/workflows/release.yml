name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: gcc make zip

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make TARGET=tuide.exe

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          make

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"
          BIN="tuide.exe"
          zip "dist/tuide-${TAG}-windows-${ARCH}.zip" "$BIN" README.md

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          OS="$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          BIN="tuide"
          tar -czf "dist/${BIN}-${TAG}-${OS}-${ARCH}.tar.gz" "$BIN" README.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-artifacts
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
